name: Bootstrap HR administrator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-hr-admin.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-hr-administrator
  cancel-in-progress: false

env:
  CLOUDFLARE_D1_DATABASE: nforce-talent-db

jobs:
  bootstrap:
    name: Initialize the first HR account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HR_BOOTSTRAP_PASSWORD: ${{ secrets.HR_BOOTSTRAP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HR_BOOTSTRAP_PASSWORD:-}" ]]; then
            echo "HR_BOOTSTRAP_PASSWORD is not configured."
            exit 1
          fi

      - name: Generate private bootstrap SQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { pbkdf2Sync, randomBytes } = require("node:crypto");
          const fs = require("node:fs");

          const password = process.env.HR_BOOTSTRAP_PASSWORD;
          if (!password || [...password].length < 8 || [...password].length > 128) {
            throw new Error("The bootstrap password must contain 8–128 characters.");
          }

          const salt = randomBytes(16).toString("hex");
          const passwordHash = [
            "pbkdf2",
            "sha256",
            "310000",
            salt,
            pbkdf2Sync(password, Buffer.from(salt, "hex"), 310000, 32, "sha256").toString("hex"),
          ].join(":");
          const recoveryHash = randomBytes(32).toString("hex");
          const now = Date.now();

          const sql = `
          INSERT OR IGNORE INTO members
            (id, email, name, role, person_id, auth_id, active, last_login_at)
          VALUES
            ('portal-hr-admin', 'hr@nforceone.com', 'HR Administrator', 'hr', NULL, 'portal-hr-admin', 1, NULL);

          UPDATE members
          SET name = 'HR Administrator',
              role = 'hr',
              active = 1
          WHERE lower(email) = 'hr@nforceone.com';

          INSERT INTO portal_credentials
            (member_id, password_hash, recovery_hash, version, updated_at, temporary, temporary_expires_at)
          SELECT
            id, '${passwordHash}', '${recoveryHash}', 1, ${now}, 0, NULL
          FROM members
          WHERE lower(email) = 'hr@nforceone.com'
          ON CONFLICT(member_id) DO UPDATE SET
            password_hash = excluded.password_hash,
            recovery_hash = excluded.recovery_hash,
            version = portal_credentials.version + 1,
            updated_at = excluded.updated_at,
            temporary = 0,
            temporary_expires_at = NULL;

          DELETE FROM portal_sessions
          WHERE member_id IN (
            SELECT id FROM members WHERE lower(email) = 'hr@nforceone.com'
          );
          `;

          fs.writeFileSync("bootstrap-hr.sql", sql, { mode: 0o600 });
          NODE

      - name: Initialize HR administrator in Cloudflare D1
        run: npx --yes wrangler@4.168.0 d1 execute "$CLOUDFLARE_D1_DATABASE" --remote --file bootstrap-hr.sql

      - name: Remove generated SQL
        if: always()
        run: rm -f bootstrap-hr.sql
